# Kitty configuration

font_family Ubuntu Mono Ligaturized
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

disable_ligatures never
enable_audio_bell no
visual_bell_duration 0.0
scrollback_lines 10000
wheel_scroll_multiplier 3.0
mouse_hide_wait 3.0
copy_on_select clipboard
confirm_os_window_close 0

window_padding_width 4
background_opacity 1.0
dynamic_background_opacity yes

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold

# Keep colors separate so changing themes does not touch behavior settings.
include themes/mocha.conf

# Send Ctrl+J (line feed) for Codex multiline input, including inside tmux.
map ctrl+enter send_text all \x0a

# Subtle rose accents over the main theme.
include themes/rose-accents.conf
